              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          private fun NanoNowPlaying(
              track: Track?, controller: MediaController?, playing: Boolean, position: Long, duration: Long,
              favorite: Boolean, onLibrary: () -> Unit, onAlbum: () -> Unit, onFavorite: () -> Unit, onQueue: () -> Unit,
              onLyrics: () -> Unit, onSound: () -> Unit, onNext: () -> Unit, onPrev: () -> Unit,
              onToggle: () -> Unit, onSeek: (Long) -> Unit, onSwipe: (Float) -> Unit,
              onShuffle: () -> Unit, shuffle: Boolean, repeat: Int, onRepeat: () -> Unit
          ) {
              var slider by remember(track?.id) { mutableFloatStateOf(0f) }
              var seeking by remember(track?.id) { mutableStateOf(false) }
              val actualProgress = (position.toFloat() / duration.coerceAtLeast(1L).toFloat()).coerceIn(0f, 1f)
              val displayedProgress = if (seeking) slider else actualProgress
              Column(
                  Modifier.fillMaxSize().background(Color(0xFF07080A))
                      .pointerInput(track?.id) {
                          var drag = 0f
                          detectHorizontalDragGestures(
                              onHorizontalDrag = { _, amount -> drag += amount },
                              onDragEnd = { if (kotlin.math.abs(drag) > 55f) onSwipe(drag); drag = 0f }
                          )
                      },
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  // Nano-style metadata header, scaled for a modern 6.7-inch phone.
                  Row(
                      Modifier.fillMaxWidth().height(58.dp).padding(horizontal = 5.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Box(Modifier.size(width = 42.dp, height = 46.dp).clickable { onLibrary() }, contentAlignment = Alignment.Center) {
                          Icon(Icons.Default.ChevronLeft, "Music library", tint = Color(0xFF9EBAD5), modifier = Modifier.size(25.dp))
                      }
                      Column(Modifier.weight(1f), horizontalAlignment = Alignment.CenterHorizontally) {
                          Text(track?.artist ?: "Choose a song", color = Color(0xFFDDE2E9), fontSize = 12.sp, fontWeight = FontWeight.Medium, maxLines = 1, overflow = TextOverflow.Ellipsis, textAlign = TextAlign.Center)
                          Text(track?.title ?: "Not Playing", color = Color(0xFFFFFFFF), fontSize = 17.sp, fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis, textAlign = TextAlign.Center)
                          Text(track?.album ?: "Pocket Player", color = Color(0xFFA8AFB9), fontSize = 11.sp, maxLines = 1, overflow = TextOverflow.Ellipsis, textAlign = TextAlign.Center, modifier = Modifier.clickable { onAlbum() })
                      }
                      Box(Modifier.size(width = 42.dp, height = 46.dp).clickable { onQueue() }, contentAlignment = Alignment.Center) {
                          Icon(Icons.Default.QueueMusic, "Up Next", tint = Color(0xFF9EBAD5), modifier = Modifier.size(19.dp))
                      }
                  }

                  // Secondary controls moved above the artwork for easy thumb reach.
                  // A restrained glassy strip echoes the polished nano 7 interface.
                  Row(
                      Modifier.fillMaxWidth().padding(horizontal = 7.dp, vertical = 2.dp)
                          .background(Brush.verticalGradient(listOf(Color(0xFF34373C), Color(0xFF17191D), Color(0xFF0A0B0D))), RoundedCornerShape(3.dp))
                          .border(0.7.dp, Color.White.copy(alpha = 0.20f), RoundedCornerShape(3.dp)),
                      horizontalArrangement = Arrangement.SpaceEvenly,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      NanoFlatAction(Icons.Default.Album, "Open current album", modifier = Modifier.weight(1f), onClick = onAlbum)
                      NanoFlatAction(Icons.Default.Shuffle, "Shuffle", active = shuffle, modifier = Modifier.weight(1f), onClick = onShuffle)
                      NanoFlatAction(if (repeat == Player.REPEAT_MODE_ONE) Icons.Default.RepeatOne else Icons.Default.Repeat, "Repeat", active = repeat != Player.REPEAT_MODE_OFF, modifier = Modifier.weight(1f), onClick = onRepeat)
                      NanoFlatAction(if (favorite) Icons.Default.Favorite else Icons.Default.FavoriteBorder, "Favorite", active = favorite, tint = if (favorite) NanoPink else Color(0xFFB8BEC7), modifier = Modifier.weight(1f), onClick = onFavorite)
                      NanoFlatAction(Icons.Default.Subject, "Lyrics", modifier = Modifier.weight(1f), onClick = onLyrics)
                      NanoFlatAction(Icons.Default.Equalizer, "Sound effects", modifier = Modifier.weight(1f), onClick = onSound)
                  }

                  // Clean square album art: no rounded-card frame or fake reflection over the artwork.
                  Box(Modifier.fillMaxWidth().weight(1f).padding(horizontal = 8.dp), contentAlignment = Alignment.Center) {
                      NanoArtwork(track, Modifier.fillMaxWidth().aspectRatio(1f))
                  }

                  // The iPod's signature transport strip: one recessed glossy panel with three silver controls.
                  Row(
                      Modifier.fillMaxWidth().padding(horizontal = 8.dp)
                          .background(Brush.verticalGradient(listOf(Color(0xFF777B82), Color(0xFF484B51), Color(0xFF25272C), Color(0xFF101114), Color(0xFF070809))))
                          .border(0.9.dp, Color.White.copy(alpha = 0.38f), RoundedCornerShape(2.dp)),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.SpaceEvenly
                  ) {
                      NanoTransportButton(Icons.Default.SkipPrevious, "Previous track", Modifier.weight(1f), 36.dp, onPrev)
                      NanoTransportButton(if (playing) Icons.Default.Pause else Icons.Default.PlayArrow, if (playing) "Pause" else "Play", Modifier.weight(1f), 44.dp, onToggle)
                      NanoTransportButton(Icons.Default.SkipNext, "Next track", Modifier.weight(1f), 36.dp, onNext)
                  }

                  // Narrow metallic seek rail with the actual elapsed/remaining time.
                  Column(Modifier.fillMaxWidth().padding(start = 14.dp, end = 14.dp, top = 7.dp, bottom = 1.dp)) {
                      Slider(
                          value = displayedProgress,
                          onValueChange = { slider = it; seeking = true },
                          onValueChangeFinished = { onSeek((slider * duration).toLong()); seeking = false },
                          modifier = Modifier.fillMaxWidth().height(20.dp),
                          thumb = {
                              Box(Modifier.size(11.dp).shadow(2.dp, CircleShape).clip(CircleShape)
                                  .background(Brush.verticalGradient(listOf(Color(0xFFFFFFFF), Color(0xFFD8DCE1), Color(0xFF777D86))))
                                  .border(0.7.dp, Color.White.copy(alpha = 0.9f), CircleShape))
                          },
                          colors = SliderDefaults.colors(
                              thumbColor = Color(0xFFE3E6EA),
                              activeTrackColor = Color(0xFFB8C0CA),
                              inactiveTrackColor = Color(0xFF46494F),
                              activeTickColor = Color.Transparent,
                              inactiveTickColor = Color.Transparent
                          )
                      )
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                          Text(formatTime(if (seeking) (slider * duration).toLong() else position), color = Color(0xFF9EA4AD), fontSize = 9.sp)
                          Text("-${formatTime((duration - if (seeking) (slider * duration).toLong() else position).coerceAtLeast(0L))}", color = Color(0xFF9EA4AD), fontSize = 9.sp)
                      }
                  }

                  Spacer(Modifier.height(3.dp))
              }
          }

