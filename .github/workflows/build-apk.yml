              icon: androidx.compose.ui.graphics.vector.ImageVector,
              contentDescription: String?,
              modifier: Modifier = Modifier,
              iconSize: androidx.compose.ui.unit.Dp = 28.dp,
              onClick: () -> Unit
          ) {
              Box(modifier.height(72.dp).clickable(onClick = onClick), contentAlignment = Alignment.Center)
                  Icon(icon, contentDescription, tint = Color(0xFFE0E5EB), modifier = Modifier.size(iconSize).shadow(0.7.dp, RoundedCornerShape(1.dp)))
              }
          }

          @Composable
          private fun NanoFlatAction(
              icon: androidx.compose.ui.graphics.vector.ImageVector,
              description: String,
              active: Boolean = false,
              tint: Color = Color(0xFFB8BEC7),
              modifier: Modifier = Modifier,
