          @Composable
          private fun NanoLibrary(page: String, filtered: List<Track>, tracks: List<Track>, search: String, onSearch: (String) -> Unit, currentId: Long, favorites: List<String>, history: List<String>, controller: MediaController?, onPage: (String) -> Unit, onPlay: (Track, List<Track>) -> Unit, onRemoveQueue: (Int) -> Unit) {
              val rows = when (page) {
                  "ALBUMS" -> filtered.distinctBy { it.albumId }.sortedBy { it.album.lowercase() }
                  "ARTISTS" -> filtered.distinctBy { it.artist }.sortedBy { it.artist.lowercase() }
                  "FAVORITES" -> filtered.filter { favorites.contains(it.id.toString()) }
                  "HISTORY" -> history.asReversed().mapNotNull { id -> tracks.firstOrNull { it.id.toString() == id } }
                  "QUEUE" -> (0 until (controller?.mediaItemCount ?: 0)).mapNotNull { i -> tracks.firstOrNull { it.id.toString() == controller?.getMediaItemAt(i)?.mediaId } }
                  else -> filtered
              }
              Column(Modifier.fillMaxSize().background(NanoWhite)) {
                  if (page == "MUSIC" || page == "ALBUMS" || page == "ARTISTS") {
                      Row(Modifier.fillMaxWidth().padding(horizontal = 13.dp, vertical = 8.dp), horizontalArrangement = Arrangement.spacedBy(18.dp)) {
                          listOf("Songs" to "MUSIC", "Albums" to "ALBUMS", "Artists" to "ARTISTS").forEach { (label, destination) ->
                              Column(Modifier.clickable { onPage(destination) }, horizontalAlignment = Alignment.CenterHorizontally) {
                                  Text(label, color = if (page == destination) NanoBlue else NanoGray, fontSize = 14.sp, fontWeight = if (page == destination) FontWeight.SemiBold else FontWeight.Normal)
                                  Spacer(Modifier.height(5.dp)); Box(Modifier.width(42.dp).height(2.dp).background(if (page == destination) NanoBlue else Color.Transparent))
                              }
                          }
                      }
                  }
                  if (page != "QUEUE") {
                      Row(Modifier.fillMaxWidth().padding(horizontal = 13.dp, vertical = 7.dp).shadow(3.dp, RoundedCornerShape(10.dp)).clip(RoundedCornerShape(10.dp)).background(Brush.verticalGradient(listOf(Color(0xFF303A47), Color(0xFF171D26)))).border(1.dp, Color.White.copy(alpha = 0.14f), RoundedCornerShape(10.dp)).padding(horizontal = 9.dp, vertical = 2.dp), verticalAlignment = Alignment.CenterVertically) {
                          Icon(Icons.Default.Search, null, tint = NanoGray, modifier = Modifier.size(19.dp))
                          androidx.compose.foundation.text.BasicTextField(value = search, onValueChange = onSearch, modifier = Modifier.weight(1f).padding(start = 7.dp), singleLine = true, textStyle = androidx.compose.ui.text.TextStyle(color = NanoInk, fontSize = 14.sp), decorationBox = { inner -> if (search.isEmpty()) Text("Search", color = NanoGray, fontSize = 14.sp); inner() })
                          if (search.isNotEmpty()) Icon(Icons.Default.Close, null, tint = NanoGray, modifier = Modifier.size(17.dp).clickable { onSearch("") })
                      }
                  }
                  if (rows.isEmpty()) {
                      Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { Column(horizontalAlignment = Alignment.CenterHorizontally) { Icon(Icons.Default.MusicNote, null, tint = NanoLine, modifier = Modifier.size(44.dp)); Spacer(Modifier.height(9.dp)); Text(if (page == "QUEUE") "No songs in Up Next" else if (page == "FAVORITES") "No Favorites" else "No Music", color = NanoGray, fontSize = 15.sp); Text("Your music on this device appears here", color = NanoGray, fontSize = 11.sp) } }
                  } else {
                      LazyColumn(Modifier.fillMaxSize()) {
                          items(rows, key = { "${page}_${it.id}" }) { track ->
                              val label = when (page) { "ALBUMS" -> track.album; "ARTISTS" -> track.artist; else -> track.title }
                              val subtitle = when (page) { "ALBUMS" -> track.artist + " · " + tracks.count { it.albumId == track.albumId } + " songs"; "ARTISTS" -> tracks.count { it.artist == track.artist }.toString() + " songs"; else -> track.artist }
                              Row(Modifier.fillMaxWidth()
                                  .background(Brush.verticalGradient(listOf(Color(0xFF191A1D), Color(0xFF101113))))
                                  .clickable {
                                      val list = when (page) { "ALBUMS" -> tracks.filter { it.albumId == track.albumId }; "ARTISTS" -> tracks.filter { it.artist == track.artist }; "FAVORITES", "HISTORY" -> rows; else -> filtered }
                                      onPlay(track, list)
                                  }.padding(start = 14.dp, end = 13.dp, top = 8.dp, bottom = 8.dp), verticalAlignment = Alignment.CenterVertically) {
                                  if (page == "ALBUMS" || page == "ARTISTS" || page == "ALBUM_DETAIL") NanoArtwork(track, Modifier.size(if (page == "ALBUM_DETAIL") 38.dp else 42.dp))
                                  Column(Modifier.weight(1f).padding(start = if (page == "ALBUMS" || page == "ARTISTS") 11.dp else 2.dp, end = 8.dp)) {
                                      Text(label, color = if (track.id == currentId) NanoBlue else NanoInk, fontSize = 14.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                      Text(subtitle, color = NanoGray, fontSize = 11.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  }
                                  if (page == "QUEUE") Icon(Icons.Default.Close, null, tint = NanoGray, modifier = Modifier.size(18.dp).clickable { onRemoveQueue(rows.indexOf(track)) })
                                  else Icon(Icons.Default.PlayArrow, null, tint = if (track.id == currentId) NanoBlue else NanoGray, modifier = Modifier.size(22.dp).clickable { onPlay(track, rows) })
                              }
                              HorizontalDivider(color = NanoLine, thickness = 0.65.dp, modifier = Modifier.padding(start = 68.dp))
                          }
                      }
                  }
              }
          }
          
          @Composable
          private fun NanoArtwork(track: Track?, modifier: Modifier = Modifier) {
              val context = LocalContext.current
              val bitmap by produceState<android.graphics.Bitmap?>(initialValue = null, track?.albumId) {
                  value = if (track == null) null else try { context.contentResolver.openInputStream(track.artwork)?.use { BitmapFactory.decodeStream(it) } } catch (_: Exception) { null }
              }
              Box(modifier.clip(RoundedCornerShape(2.dp)).background(Color(0xFF08090B)).border(0.7.dp, Color.White.copy(alpha = 0.22f), RoundedCornerShape(2.dp)), contentAlignment = Alignment.Center) {
                  if (bitmap != null) Image(bitmap!!.asImageBitmap(), contentDescription = "Album artwork", modifier = Modifier.fillMaxSize())
                  else Icon(Icons.Default.MusicNote, null, tint = Color(0xFFCAD0D8), modifier = Modifier.size(38.dp))
              }
          }

          // Nano 7 transport controls are monochrome glyphs on a single dark control strip,
          // not separate round buttons. This helper deliberately has no button body or glow.
