name: Build Pocket Player APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms/android-35" || {
            echo 'Android API 35 is not preinstalled on this runner.'
            ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
            exit 1
          }

      - name: Generate Pocket Player project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/pocketplayer
          cat > settings.gradle.kts <<'GRADLE_SETTINGS'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "PocketPlayer"
          include(":app")
          GRADLE_SETTINGS

          cat > build.gradle.kts <<'ROOT_GRADLE'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          ROOT_GRADLE

          cat > gradle.properties <<'GRADLE_PROPERTIES'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          GRADLE_PROPERTIES

          cat > app/build.gradle.kts <<'APP_GRADLE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.pocketplayer"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.pocketplayer"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0.0"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.media3:media3-exoplayer:1.5.1")
              implementation("androidx.media3:media3-session:1.5.1")
              implementation("androidx.media3:media3-common:1.5.1")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          APP_GRADLE

          cat > app/src/main/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <application
                  android:allowBackup="true"
                  android:label="Pocket Player"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".PlaybackService"
                      android:exported="true"
                      android:foregroundServiceType="mediaPlayback">
                      <intent-filter>
                          <action android:name="androidx.media3.session.MediaSessionService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          MANIFEST

          cat > app/src/main/java/com/pocketplayer/PlaybackService.kt <<'KOTLIN_SERVICE'
          package com.pocketplayer

          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService

          object AudioSessionHolder {
              @Volatile var sessionId: Int = 0
          }

          class PlaybackService : MediaSessionService() {
              private var mediaSession: MediaSession? = null
              override fun onCreate() {
                  super.onCreate()
                  val audioAttributes = AudioAttributes.Builder()
                      .setUsage(C.USAGE_MEDIA)
                      .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                      .build()
                  val player = ExoPlayer.Builder(this).build().apply {
                      setAudioAttributes(audioAttributes, true)
                      setHandleAudioBecomingNoisy(true)
                  }
                  AudioSessionHolder.sessionId = player.audioSessionId
                  mediaSession = MediaSession.Builder(this, player).build()
              }
              override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? = mediaSession
              override fun onDestroy() {
                  mediaSession?.run { player.release(); release() }
                  mediaSession = null
                  super.onDestroy()
              }
          }
          KOTLIN_SERVICE

          cat > app/src/main/java/com/pocketplayer/MainActivity.kt <<'KOTLIN_MAIN'
          package com.pocketplayer

          import android.Manifest
          import android.content.ComponentName
          import android.content.ContentUris
          import android.content.Context
          import android.content.pm.PackageManager
          import android.graphics.BitmapFactory
          import android.media.audiofx.BassBoost
          import android.media.audiofx.Equalizer
          import android.media.audiofx.Virtualizer
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectHorizontalDragGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.content.ContextCompat
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MediaMetadata
          import androidx.media3.common.Player
          import androidx.media3.session.MediaController
          import androidx.media3.session.SessionToken
          import com.google.common.util.concurrent.ListenableFuture
          import kotlinx.coroutines.delay

          private val Paper = Color(0xFFF5F5F7)
          private val White = Color(0xFFFFFFFF)
          private val Ink = Color(0xFF17171A)
          private val Muted = Color(0xFF85858B)
          private val Line = Color(0xFFE0E0E5)
          private val Blue = Color(0xFF168BE1)
          private val Green = Color(0xFF72B94A)
          private val Orange = Color(0xFFFF9D35)
          private val Pink = Color(0xFFE95780)
          private val Purple = Color(0xFF8A70D6)

          private data class Track(
              val id: Long,
              val title: String,
              val artist: String,
              val album: String,
              val albumId: Long,
              val uri: Uri,
              val duration: Long
          ) {
              val artwork: Uri get() = ContentUris.withAppendedId(Uri.parse("content://media/external/audio/albumart"), albumId)
          }

          class MainActivity : ComponentActivity() {
              private var controllerFuture: ListenableFuture<MediaController>? = null
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = android.graphics.Color.rgb(245, 245, 247)
                  window.navigationBarColor = android.graphics.Color.rgb(245, 245, 247)
                  if (Build.VERSION.SDK_INT >= 26) {
                      window.decorView.systemUiVisibility =
                          android.view.View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR or android.view.View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                  }
                  val controllerState = mutableStateOf<MediaController?>(null)
                  val token = SessionToken(this, ComponentName(this, PlaybackService::class.java))
                  controllerFuture = MediaController.Builder(this, token).buildAsync().also { future ->
                      future.addListener({ try { controllerState.value = future.get() } catch (_: Exception) { } }, ContextCompat.getMainExecutor(this))
                  }
                  setContent {
                      MaterialTheme(colorScheme = lightColorScheme(primary = Blue, background = Paper, surface = White, onSurface = Ink)) {
                          val controller by remember { controllerState }
                          PocketApp(controller, loadTracks = { scanTracks(this) })
                      }
                  }
              }
              override fun onDestroy() {
                  controllerFuture?.let { MediaController.releaseFuture(it) }
                  controllerFuture = null
                  super.onDestroy()
              }
          }

          private fun scanTracks(context: Context): List<Track> {
              val result = mutableListOf<Track>()
              val collection = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
              val projection = arrayOf(MediaStore.Audio.Media._ID, MediaStore.Audio.Media.TITLE, MediaStore.Audio.Media.ARTIST, MediaStore.Audio.Media.ALBUM, MediaStore.Audio.Media.ALBUM_ID, MediaStore.Audio.Media.DURATION)
              context.contentResolver.query(collection, projection, "${MediaStore.Audio.Media.IS_MUSIC} != 0", null, "${MediaStore.Audio.Media.TITLE} COLLATE NOCASE ASC")?.use { c ->
                  val id = c.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                  val title = c.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
                  val artist = c.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST)
                  val album = c.getColumnIndexOrThrow(MediaStore.Audio.Media.ALBUM)
                  val albumId = c.getColumnIndexOrThrow(MediaStore.Audio.Media.ALBUM_ID)
                  val duration = c.getColumnIndexOrThrow(MediaStore.Audio.Media.DURATION)
                  while (c.moveToNext()) {
                      val tid = c.getLong(id)
                      result += Track(tid, c.getString(title)?.takeIf { it.isNotBlank() } ?: "Unknown track", c.getString(artist)?.takeIf { it.isNotBlank() && it != "<unknown>" } ?: "Unknown artist", c.getString(album)?.takeIf { it.isNotBlank() && it != "<unknown>" } ?: "Unknown album", c.getLong(albumId), ContentUris.withAppendedId(collection, tid), c.getLong(duration))
                  }
              }
              return result
          }

          @Composable
          private fun PocketApp(controller: MediaController?, loadTracks: () -> List<Track>) {
              val context = LocalContext.current
              val permission = if (Build.VERSION.SDK_INT >= 33) Manifest.permission.READ_MEDIA_AUDIO else Manifest.permission.READ_EXTERNAL_STORAGE
              var allowed by remember { mutableStateOf(ContextCompat.checkSelfPermission(context, permission) == PackageManager.PERMISSION_GRANTED) }
              var tracks by remember { mutableStateOf(emptyList<Track>()) }
              var page by remember { mutableStateOf("HOME") }
              var section by remember { mutableStateOf("Songs") }
              var search by remember { mutableStateOf("") }
              var currentId by remember { mutableLongStateOf(-1L) }
              var playing by remember { mutableStateOf(false) }
              var position by remember { mutableLongStateOf(0L) }
              var duration by remember { mutableLongStateOf(1L) }
              var shuffle by remember { mutableStateOf(false) }
              var repeat by remember { mutableIntStateOf(Player.REPEAT_MODE_OFF) }
              var favorites by remember { mutableStateOf(context.getSharedPreferences("pocket", Context.MODE_PRIVATE).getStringSet("favorites", emptySet())?.toMutableSet() ?: mutableSetOf()) }
              var history by remember { mutableStateOf(context.getSharedPreferences("pocket", Context.MODE_PRIVATE).getStringSet("history", emptySet())?.toMutableSet() ?: mutableSetOf()) }
              var soundPage by remember { mutableStateOf("SOUND") }
              var bass by remember { mutableFloatStateOf(0.25f) }
              var space by remember { mutableFloatStateOf(0.20f) }
              var eqEnabled by remember { mutableStateOf(true) }
              var eqPreset by remember { mutableStateOf("Flat") }
              var eqLevels by remember { mutableStateOf(List(5) { 0f }) }
              var eqBands by remember { mutableStateOf<List<Pair<String, Float>>>(listOf("60 Hz" to 0f, "230 Hz" to 0f, "910 Hz" to 0f, "3.6 kHz" to 0f, "14 kHz" to 0f)) }
              val permissionLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { granted -> allowed = granted; if (granted) tracks = loadTracks() }
              LaunchedEffect(allowed) {
                  if (allowed) tracks = loadTracks() else permissionLauncher.launch(permission)
              }
              LaunchedEffect(controller) {
                  while (true) {
                      if (controller != null) {
                          playing = controller.isPlaying
                          currentId = controller.currentMediaItem?.mediaId?.toLongOrNull() ?: currentId
                          position = controller.currentPosition.coerceAtLeast(0)
                          duration = controller.duration.takeIf { it > 0 } ?: 1L
                          shuffle = controller.shuffleModeEnabled
                          repeat = controller.repeatMode
                      }
                      delay(300)
                  }
              }
              DisposableEffect(controller) {
                  val listener = object : Player.Listener {
                      override fun onMediaItemTransition(mediaItem: MediaItem?, reason: Int) {
                          currentId = mediaItem?.mediaId?.toLongOrNull() ?: -1L
                          val id = currentId.toString()
                          if (currentId >= 0) {
                              history.add(id)
                              context.getSharedPreferences("pocket", Context.MODE_PRIVATE).edit().putStringSet("history", history.toSet()).apply()
                          }
                      }
                  }
                  controller?.addListener(listener)
                  onDispose { controller?.removeListener(listener) }
              }
              val current = tracks.firstOrNull { it.id == currentId }
              val filtered = tracks.filter { (it.title + " " + it.artist + " " + it.album).contains(search, true) }

              Column(Modifier.fillMaxSize().background(Paper)) {
                  TopBar(page = page, onBack = { page = if (page == "SOUND" || page == "SETTINGS") "SETTINGS" else "HOME" }, onHome = { page = "HOME" })
                  when (page) {
                      "HOME" -> HomeScreen(onOpen = { page = it })
                      "PLAYING" -> NowPlayingScreen(current, controller, playing, position, duration, favorites.contains(current?.id?.toString()), onToggleFavorite = {
                          current?.let { t -> if (!favorites.add(t.id.toString())) favorites.remove(t.id.toString()); favorites = favorites.toMutableSet(); context.getSharedPreferences("pocket", Context.MODE_PRIVATE).edit().putStringSet("favorites", favorites.toSet()).apply() }
                      }, onQueue = { page = "QUEUE" }, onLyrics = { page = "LYRICS" }, onSound = { page = "SOUND" }, onNext = { controller?.seekToNextMediaItem() }, onPrev = { controller?.seekToPreviousMediaItem() }, onTogglePlay = { if (controller?.isPlaying == true) controller.pause() else controller?.play() }, onSeek = { controller?.seekTo(it) }, onSwipe = { direction -> if (direction < 0) controller?.seekToNextMediaItem() else controller?.seekToPreviousMediaItem() })
                      "MUSIC", "ALBUMS", "ARTISTS", "FAVORITES", "HISTORY", "QUEUE" -> LibraryScreen(page, section, filtered, tracks, search, { search = it }, currentId, favorites, history, controller, onSection = { label ->
                          section = label
                          page = when (label) { "Albums" -> "ALBUMS"; "Artists" -> "ARTISTS"; else -> "MUSIC" }
                      }, onPlay = { t, list ->
                          val playlist = list.ifEmpty { tracks }
                          val index = playlist.indexOfFirst { it.id == t.id }.coerceAtLeast(0)
                          controller?.setMediaItems(playlist.map { track -> MediaItem.Builder().setMediaId(track.id.toString()).setUri(track.uri).setMediaMetadata(MediaMetadata.Builder().setTitle(track.title).setArtist(track.artist).setAlbumTitle(track.album).setArtworkUri(track.artwork).build()).build() }, index, 0L)
                          controller?.prepare(); controller?.play(); currentId = t.id; page = "PLAYING"
                      }, onPlayCurrent = { page = "PLAYING" }, onBack = { page = "HOME" }, onRemoveQueue = { index -> controller?.removeMediaItem(index) })
                      "SETTINGS" -> SettingsScreen(onSound = { page = "SOUND" }, onLibrary = { page = "MUSIC" }, onAbout = { page = "ABOUT" })
                      "SOUND" -> SoundScreen(bass, space, eqEnabled, eqPreset, eqLevels, onBass = { bass = it }, onSpace = { space = it }, onEnable = { eqEnabled = it }, onPreset = { preset ->
                          eqPreset = preset
                          val presetLevels = when (preset) { "Bass" -> listOf(7f, 5f, 1f, 0f, 2f); "Rock" -> listOf(5f, 3f, -1f, 3f, 5f); "Vocal" -> listOf(-2f, 0f, 4f, 3f, 1f); "Treble" -> listOf(-1f, 0f, 1f, 4f, 7f); else -> List(5) { 0f } }
                          eqLevels = presetLevels
                      }, onLevel = { index, value -> eqLevels = eqLevels.toMutableList().also { it[index] = value }; eqPreset = "Custom" })
                      "LYRICS" -> LyricsScreen(current)
                      "ABOUT" -> AboutScreen()
                  }
                  BottomDock(current, playing, onLibrary = { page = "MUSIC" }, onPlaying = { page = "PLAYING" }, onSettings = { page = "SETTINGS" }, onPlayPause = { if (controller?.isPlaying == true) controller.pause() else controller?.play() }, onNext = { controller?.seekToNextMediaItem() })
              }
              DisposableEffect(currentId, eqEnabled, bass, space, eqLevels) {
                  val session = AudioSessionHolder.sessionId
                  var eq: Equalizer? = null
                  var bb: BassBoost? = null
                  var vz: Virtualizer? = null
                  if (session > 0) {
                      try {
                          eq = Equalizer(0, session).apply {
                              enabled = eqEnabled
                              for (i in 0 until numberOfBands.toInt().coerceAtMost(eqLevels.size)) {
                                  val range = bandLevelRange
                                  val level = (eqLevels[i] * 100).toInt().coerceIn(range[0].toInt(), range[1].toInt())
                                  setBandLevel(i.toShort(), level.toShort())
                              }
                          }
                          bb = BassBoost(0, session).apply { enabled = eqEnabled; setStrength((bass * 1000).toInt().toShort()) }
                          vz = Virtualizer(0, session).apply { enabled = eqEnabled; setStrength((space * 1000).toInt().toShort()) }
                      } catch (_: Exception) { }
                  }
                  onDispose { try { eq?.release(); bb?.release(); vz?.release() } catch (_: Exception) { } }
              }
          }

          @Composable
          private fun TopBar(page: String, onBack: () -> Unit, onHome: () -> Unit) {
              Row(Modifier.fillMaxWidth().background(White).padding(horizontal = 14.dp, vertical = 10.dp), verticalAlignment = Alignment.CenterVertically) {
                  if (page != "HOME") IconButton(onClick = onBack, modifier = Modifier.size(38.dp)) { Icon(Icons.Default.ChevronLeft, null, tint = Blue, modifier = Modifier.size(30.dp)) }
                  else Box(Modifier.size(32.dp).clip(RoundedCornerShape(9.dp)).background(Blue), contentAlignment = Alignment.Center) { Icon(Icons.Default.MusicNote, null, tint = White) }
                  Column(Modifier.weight(1f).padding(start = 5.dp)) {
                      Text(if (page == "HOME") "iPod" else pageTitle(page), color = Ink, fontWeight = FontWeight.Bold, fontSize = 19.sp)
                      if (page == "HOME") Text("nano-inspired music player", color = Muted, fontSize = 10.sp)
                  }
                  IconButton(onClick = onHome, modifier = Modifier.size(38.dp)) { Icon(Icons.Default.Home, null, tint = Blue) }
              }
              HorizontalDivider(color = Line, thickness = 0.7.dp)
          }
          private fun pageTitle(page: String) = when (page) { "MUSIC" -> "Music"; "ALBUMS" -> "Albums"; "ARTISTS" -> "Artists"; "FAVORITES" -> "Favorites"; "HISTORY" -> "Recently played"; "PLAYING" -> "Now Playing"; "QUEUE" -> "Up Next"; "SETTINGS" -> "Settings"; "SOUND" -> "Sound"; "LYRICS" -> "Lyrics"; "ABOUT" -> "About"; else -> page }

          @Composable
          private fun HomeScreen(onOpen: (String) -> Unit) {
              Column(Modifier.fillMaxSize().padding(horizontal = 22.dp)) {
                  Spacer(Modifier.height(18.dp))
                  Text("Music", fontSize = 28.sp, color = Ink, fontWeight = FontWeight.Light)
                  Text("Your library, beautifully simple.", color = Muted, fontSize = 13.sp)
                  Spacer(Modifier.height(26.dp))
                  val items = listOf(
                      Triple("Music", "MUSIC", Blue), Triple("Now Playing", "PLAYING", Green),
                      Triple("Albums", "ALBUMS", Orange), Triple("Artists", "ARTISTS", Purple),
                      Triple("Favorites", "FAVORITES", Pink), Triple("Recently Played", "HISTORY", Color(0xFF49B8B0)),
                      Triple("Up Next", "QUEUE", Color(0xFF777F8C)), Triple("Settings", "SETTINGS", Color(0xFF9D9DA4))
                  )
                  Column(verticalArrangement = Arrangement.spacedBy(22.dp)) {
                      items.chunked(4).forEach { rowItems ->
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                              rowItems.forEach { (label, dest, color) ->
                                  Column(Modifier.weight(1f).clickable { onOpen(dest) }, horizontalAlignment = Alignment.CenterHorizontally) {
                                      Box(Modifier.size(58.dp).clip(RoundedCornerShape(14.dp)).background(color), contentAlignment = Alignment.Center) {
                                          Icon(when (dest) { "MUSIC" -> Icons.Default.MusicNote; "PLAYING" -> Icons.Default.PlayArrow; "ALBUMS" -> Icons.Default.Album; "ARTISTS" -> Icons.Default.Person; "FAVORITES" -> Icons.Default.Favorite; "HISTORY" -> Icons.Default.History; "QUEUE" -> Icons.Default.QueueMusic; else -> Icons.Default.Settings }, null, tint = White, modifier = Modifier.size(31.dp))
                                      }
                                      Spacer(Modifier.height(7.dp))
                                      Text(label, color = Ink, fontSize = 11.sp, textAlign = TextAlign.Center, maxLines = 2, lineHeight = 13.sp)
                                  }
                              }
                              repeat(4 - rowItems.size) { Spacer(Modifier.weight(1f)) }
                          }
                      }
                  }
                  Spacer(Modifier.weight(1f))
                  Surface(color = White, shape = RoundedCornerShape(18.dp), shadowElevation = 1.dp, modifier = Modifier.fillMaxWidth().clickable { onOpen("PLAYING") }) {
                      Row(Modifier.padding(12.dp), verticalAlignment = Alignment.CenterVertically) {
                          Box(Modifier.size(45.dp).clip(RoundedCornerShape(8.dp)).background(Paper), contentAlignment = Alignment.Center) { Icon(Icons.Default.Album, null, tint = Blue, modifier = Modifier.size(27.dp)) }
                          Column(Modifier.weight(1f).padding(start = 11.dp)) { Text("Now Playing", color = Ink, fontWeight = FontWeight.SemiBold); Text("Open player", color = Muted, fontSize = 12.sp) }
                          Icon(Icons.Default.ChevronRight, null, tint = Muted)
                      }
                  }
                  Spacer(Modifier.height(14.dp))
              }
          }

          @Composable
          private fun LibraryScreen(page: String, section: String, filtered: List<Track>, tracks: List<Track>, search: String, onSearch: (String) -> Unit, currentId: Long, favorites: Set<String>, history: Set<String>, controller: MediaController?, onSection: (String) -> Unit, onPlay: (Track, List<Track>) -> Unit, onPlayCurrent: () -> Unit, onBack: () -> Unit, onRemoveQueue: (Int) -> Unit) {
              val context = LocalContext.current
              val rows = when (page) {
                  "ALBUMS" -> filtered.distinctBy { it.albumId }.sortedBy { it.album.lowercase() }
                  "ARTISTS" -> filtered.distinctBy { it.artist }.sortedBy { it.artist.lowercase() }
                  "FAVORITES" -> filtered.filter { favorites.contains(it.id.toString()) }
                  "HISTORY" -> history.toList().asReversed().mapNotNull { id -> tracks.firstOrNull { it.id.toString() == id } }
                  "QUEUE" -> (0 until (controller?.mediaItemCount ?: 0)).mapNotNull { i -> tracks.firstOrNull { it.id.toString() == controller?.getMediaItemAt(i)?.mediaId } }
                  else -> filtered
              }
              Column(Modifier.fillMaxSize().padding(horizontal = 16.dp)) {
                  if (page == "MUSIC" || page == "ALBUMS" || page == "ARTISTS") {
                      Spacer(Modifier.height(10.dp))
                      Row(horizontalArrangement = Arrangement.spacedBy(7.dp)) {
                          listOf("Songs", "Albums", "Artists").forEach { label ->
                              val active = section == label
                              Surface(color = if (active) Blue else White, shape = RoundedCornerShape(22.dp), modifier = Modifier.clickable { onSection(label) }) {
                                  Text(label, color = if (active) White else Muted, modifier = Modifier.padding(horizontal = 16.dp, vertical = 9.dp), fontSize = 12.sp, fontWeight = FontWeight.Medium)
                              }
                          }
                      }
                      Spacer(Modifier.height(9.dp))
                  }
                  if (page != "QUEUE") {
                      OutlinedTextField(value = search, onValueChange = onSearch, modifier = Modifier.fillMaxWidth(), singleLine = true, placeholder = { Text("Search your music", color = Muted) }, leadingIcon = { Icon(Icons.Default.Search, null, tint = Muted) }, shape = RoundedCornerShape(12.dp), colors = OutlinedTextFieldDefaults.colors(focusedBorderColor = Blue, unfocusedBorderColor = Line, focusedTextColor = Ink, unfocusedTextColor = Ink, cursorColor = Blue, unfocusedContainerColor = White, focusedContainerColor = White))
                  }
                  Spacer(Modifier.height(10.dp))
                  if (page == "QUEUE") Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) { Text("${rows.size} tracks in queue", color = Muted, fontSize = 12.sp); Spacer(Modifier.weight(1f)); Text("Shuffle", color = Blue, fontSize = 12.sp, modifier = Modifier.clickable { controller?.shuffleModeEnabled = !(controller?.shuffleModeEnabled ?: false) }) }
                  if (rows.isEmpty()) {
                      Box(Modifier.weight(1f).fillMaxWidth(), contentAlignment = Alignment.Center) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Icon(if (page == "FAVORITES") Icons.Default.FavoriteBorder else Icons.Default.LibraryMusic, null, tint = Muted, modifier = Modifier.size(42.dp))
                              Spacer(Modifier.height(8.dp))
                              Text(if (page == "QUEUE") "Queue is empty" else if (page == "FAVORITES") "No favorites yet" else "No music found", color = Ink, fontWeight = FontWeight.SemiBold)
                              Text(if (page == "FAVORITES") "Tap the heart in Now Playing" else "Add audio files to your phone", color = Muted, fontSize = 12.sp)
                              if (page == "MUSIC" && tracks.isEmpty()) Text("Allow audio access when prompted", color = Muted, fontSize = 11.sp)
                          }
                      }
                  } else {
                      LazyColumn(Modifier.weight(1f), contentPadding = PaddingValues(bottom = 10.dp), verticalArrangement = Arrangement.spacedBy(1.dp)) {
                          items(rows, key = { "${page}_${it.id}" }) { track ->
                              val label = when (page) { "ALBUMS" -> track.album; "ARTISTS" -> track.artist; else -> track.title }
                              val subtitle = when (page) { "ALBUMS" -> "${tracks.count { it.albumId == track.albumId }} songs · ${track.artist}"; "ARTISTS" -> "${tracks.count { it.artist == track.artist }} songs"; else -> "${track.artist}  •  ${track.album}" }
                              Row(Modifier.fillMaxWidth().clickable {
                                  if (page == "QUEUE") { onPlay(track, rows) }
                                  else if (page == "ALBUMS") onPlay(track, tracks.filter { it.albumId == track.albumId })
                                  else if (page == "ARTISTS") onPlay(track, tracks.filter { it.artist == track.artist })
                                  else onPlay(track, if (page == "FAVORITES") rows else if (page == "HISTORY") rows else filtered)
                              }.padding(vertical = 8.dp), verticalAlignment = Alignment.CenterVertically) {
                                  AlbumArt(track, Modifier.size(49.dp))
                                  Column(Modifier.weight(1f).padding(start = 11.dp, end = 6.dp)) {
                                      Text(label, color = Ink, fontSize = 14.sp, fontWeight = if (track.id == currentId) FontWeight.Bold else FontWeight.Medium, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                      Text(subtitle, color = Muted, fontSize = 11.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  }
                                  if (page == "QUEUE") Text(formatTime(track.duration), color = Muted, fontSize = 11.sp)
                                  else IconButton(onClick = { onPlay(track, filtered) }, modifier = Modifier.size(36.dp)) { Icon(if (track.id == currentId) Icons.Default.Equalizer else Icons.Default.PlayArrow, null, tint = if (track.id == currentId) Blue else Muted) }
                              }
                              HorizontalDivider(color = Line, thickness = 0.6.dp)
                          }
                      }
                  }
              }
          }

          @Composable
          private fun AlbumArt(track: Track?, modifier: Modifier = Modifier) {
              val context = LocalContext.current
              val bitmap by produceState<android.graphics.Bitmap?>(initialValue = null, track?.albumId) {
                  value = if (track == null) null else try { context.contentResolver.openInputStream(track.artwork)?.use { BitmapFactory.decodeStream(it) } } catch (_: Exception) { null }
              }
              Box(modifier.clip(RoundedCornerShape(9.dp)).background(Color(0xFFE5E9EF)), contentAlignment = Alignment.Center) {
                  if (bitmap != null) Image(bitmap!!.asImageBitmap(), contentDescription = "Album artwork", modifier = Modifier.fillMaxSize())
                  else Icon(Icons.Default.MusicNote, null, tint = Blue, modifier = Modifier.size(25.dp))
              }
          }

          @Composable
          private fun NowPlayingScreen(track: Track?, controller: MediaController?, playing: Boolean, position: Long, duration: Long, favorite: Boolean, onToggleFavorite: () -> Unit, onQueue: () -> Unit, onLyrics: () -> Unit, onSound: () -> Unit, onNext: () -> Unit, onPrev: () -> Unit, onTogglePlay: () -> Unit, onSeek: (Long) -> Unit, onSwipe: (Float) -> Unit) {
              var slider by remember(track?.id) { mutableFloatStateOf(0f) }
              Column(Modifier.fillMaxSize().padding(horizontal = 27.dp).pointerInput(track?.id) { var drag = 0f; detectHorizontalDragGestures(onHorizontalDrag = { _, amount -> drag += amount }, onDragEnd = { if (kotlin.math.abs(drag) > 55) onSwipe(drag); drag = 0f }) }, horizontalAlignment = Alignment.CenterHorizontally) {
                  Spacer(Modifier.height(16.dp))
                  Text("NOW PLAYING", color = Muted, fontSize = 10.sp, letterSpacing = 2.sp, fontWeight = FontWeight.Bold)
                  Spacer(Modifier.height(14.dp))
                  Box(Modifier.fillMaxWidth().weight(0.9f), contentAlignment = Alignment.Center) {
                      Surface(shape = RoundedCornerShape(9.dp), shadowElevation = 6.dp, color = White, modifier = Modifier.fillMaxWidth().aspectRatio(1f)) { AlbumArt(track, Modifier.fillMaxSize()) }
                  }
                  Spacer(Modifier.height(19.dp))
                  Text(track?.title ?: "Choose a song", color = Ink, fontSize = 21.sp, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis, textAlign = TextAlign.Center)
                  Text(track?.artist ?: "Your music library", color = Muted, fontSize = 14.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                  Spacer(Modifier.height(12.dp))
                  Slider(value = (position.toFloat() / duration.coerceAtLeast(1).toFloat()).coerceIn(0f, 1f), onValueChange = { slider = it }, onValueChangeFinished = { onSeek((slider * duration).toLong()) }, colors = SliderDefaults.colors(thumbColor = Blue, activeTrackColor = Blue, inactiveTrackColor = Line), modifier = Modifier.height(25.dp))
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) { Text(formatTime(position), color = Muted, fontSize = 10.sp); Text("-${formatTime((duration - position).coerceAtLeast(0))}", color = Muted, fontSize = 10.sp) }
                  Spacer(Modifier.height(14.dp))
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                      IconButton(onClick = onToggleFavorite) { Icon(if (favorite) Icons.Default.Favorite else Icons.Default.FavoriteBorder, null, tint = if (favorite) Pink else Muted) }
                      IconButton(onClick = onPrev, modifier = Modifier.size(48.dp)) { Icon(Icons.Default.SkipPrevious, null, tint = Ink, modifier = Modifier.size(32.dp)) }
                      Surface(color = Blue, shape = CircleShape, modifier = Modifier.size(66.dp).clickable { onTogglePlay() }) { Box(contentAlignment = Alignment.Center) { Icon(if (playing) Icons.Default.Pause else Icons.Default.PlayArrow, null, tint = White, modifier = Modifier.size(35.dp)) } }
                      IconButton(onClick = onNext, modifier = Modifier.size(48.dp)) { Icon(Icons.Default.SkipNext, null, tint = Ink, modifier = Modifier.size(32.dp)) }
                      IconButton(onClick = onQueue) { Icon(Icons.Default.QueueMusic, null, tint = Muted) }
                  }
                  Spacer(Modifier.height(14.dp))
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                      Text("LYRICS", color = Blue, fontSize = 10.sp, fontWeight = FontWeight.Bold, modifier = Modifier.clickable { onLyrics() }.padding(8.dp))
                      Text("SOUND", color = Blue, fontSize = 10.sp, fontWeight = FontWeight.Bold, modifier = Modifier.clickable { onSound() }.padding(8.dp))
                  }
                  Spacer(Modifier.height(6.dp))
              }
          }

          @Composable
          private fun BottomDock(current: Track?, playing: Boolean, onLibrary: () -> Unit, onPlaying: () -> Unit, onSettings: () -> Unit, onPlayPause: () -> Unit, onNext: () -> Unit) {
              Surface(color = White, shadowElevation = 5.dp) {
                  Column {
                      HorizontalDivider(color = Line, thickness = 0.7.dp)
                      Row(Modifier.fillMaxWidth().height(55.dp).padding(horizontal = 22.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                          DockItem(Icons.Default.LibraryMusic, "Music", onLibrary)
                          DockItem(Icons.Default.Album, "Playing", onPlaying)
                          DockItem(Icons.Default.Settings, "Settings", onSettings)
                      }
                  }
              }
          }
          @Composable
          private fun DockItem(icon: androidx.compose.ui.graphics.vector.ImageVector, label: String, action: () -> Unit) {
              Column(Modifier.clickable { action() }.padding(horizontal = 16.dp, vertical = 3.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                  Icon(icon, null, tint = Blue, modifier = Modifier.size(22.dp))
                  Text(label, color = Muted, fontSize = 9.sp)
              }
          }

          @Composable
          private fun SettingsScreen(onSound: () -> Unit, onLibrary: () -> Unit, onAbout: () -> Unit) {
              Column(Modifier.fillMaxSize().padding(horizontal = 16.dp)) {
                  Spacer(Modifier.height(15.dp)); Text("GENERAL", color = Muted, fontSize = 10.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.5.sp)
                  Spacer(Modifier.height(8.dp))
                  SettingsRow(Icons.Default.Tune, "Sound & equalizer", "Walkman-inspired sound controls", onSound, Blue)
                  SettingsRow(Icons.Default.LibraryMusic, "Music library", "Browse all local audio", onLibrary, Green)
                  SettingsRow(Icons.Default.Info, "About Pocket Player", "Version 2.0 · built for Android", onAbout, Purple)
                  Spacer(Modifier.height(22.dp)); Text("PLAYBACK", color = Muted, fontSize = 10.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.5.sp)
                  Spacer(Modifier.height(8.dp))
                  Surface(color = White, shape = RoundedCornerShape(13.dp)) {
                      Column(Modifier.padding(15.dp)) {
                          Text("Gapless playback", color = Ink, fontWeight = FontWeight.SemiBold)
                          Text("Media3 handles transitions between queued tracks; behaviour can depend on the audio files.", color = Muted, fontSize = 12.sp)
                      }
                  }
                  Spacer(Modifier.height(20.dp))
                  Text("Sound processing uses Android audio effects where supported. Some effects can be limited by the ROM, Bluetooth output or audio route.", color = Muted, fontSize = 11.sp, lineHeight = 16.sp)
              }
          }

          @Composable
          private fun SettingsRow(icon: androidx.compose.ui.graphics.vector.ImageVector, title: String, subtitle: String, onClick: () -> Unit, color: Color) {
              Row(Modifier.fillMaxWidth().padding(vertical = 5.dp).clip(RoundedCornerShape(13.dp)).background(White).clickable { onClick() }.padding(12.dp), verticalAlignment = Alignment.CenterVertically) {
                  Box(Modifier.size(40.dp).clip(RoundedCornerShape(10.dp)).background(color), contentAlignment = Alignment.Center) { Icon(icon, null, tint = White) }
                  Column(Modifier.weight(1f).padding(start = 12.dp)) { Text(title, color = Ink, fontWeight = FontWeight.SemiBold, fontSize = 14.sp); Text(subtitle, color = Muted, fontSize = 11.sp) }
                  Icon(Icons.Default.ChevronRight, null, tint = Muted)
              }
          }

          @Composable
          private fun SoundScreen(bass: Float, space: Float, enabled: Boolean, preset: String, levels: List<Float>, onBass: (Float) -> Unit, onSpace: (Float) -> Unit, onEnable: (Boolean) -> Unit, onPreset: (String) -> Unit, onLevel: (Int, Float) -> Unit) {
              Column(Modifier.fillMaxSize().padding(horizontal = 16.dp)) {
                  Spacer(Modifier.height(12.dp))
                  Row(verticalAlignment = Alignment.CenterVertically) { Column(Modifier.weight(1f)) { Text("Sound settings", color = Ink, fontSize = 23.sp, fontWeight = FontWeight.Bold); Text("Inspired by Sony Walkman", color = Muted, fontSize = 12.sp) }; Switch(checked = enabled, onCheckedChange = onEnable) }
                  Spacer(Modifier.height(12.dp))
                  Text("EQUALIZER PRESETS", color = Muted, fontSize = 10.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.2.sp)
                  Spacer(Modifier.height(8.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(7.dp)) {
                      listOf("Flat", "Bass", "Rock", "Vocal", "Treble").forEach { name ->
                          Surface(color = if (preset == name) Blue else White, shape = RoundedCornerShape(20.dp), modifier = Modifier.weight(1f).clickable { onPreset(name) }) {
                              Text(name, color = if (preset == name) White else Muted, fontSize = 10.sp, textAlign = TextAlign.Center, modifier = Modifier.padding(vertical = 10.dp), maxLines = 1)
                          }
                      }
                  }
                  Spacer(Modifier.height(12.dp))
                  Surface(color = White, shape = RoundedCornerShape(14.dp)) {
                      Column(Modifier.padding(horizontal = 14.dp, vertical = 10.dp)) {
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) { Text("Equalizer", color = Ink, fontWeight = FontWeight.SemiBold); Text(preset, color = Blue, fontSize = 12.sp) }
                          Spacer(Modifier.height(7.dp))
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(7.dp), verticalAlignment = Alignment.Bottom) {
                              levels.forEachIndexed { index, level ->
                                  Column(Modifier.weight(1f), horizontalAlignment = Alignment.CenterHorizontally) {
                                      Text("${level.toInt()} dB", color = Muted, fontSize = 9.sp)
                                      Slider(value = level, onValueChange = { onLevel(index, it) }, valueRange = -10f..10f, modifier = Modifier.height(140.dp).width(34.dp), colors = SliderDefaults.colors(thumbColor = Blue, activeTrackColor = Blue, inactiveTrackColor = Line))
                                      Text(listOf("60", "230", "910", "3.6k", "14k")[index], color = Muted, fontSize = 9.sp)
                                  }
                              }
                          }
                      }
                  }
                  Spacer(Modifier.height(12.dp))
                  SoundSlider("Clear Bass", "Low-frequency enhancement", bass, onBass, "Off", "Max")
                  Spacer(Modifier.height(9.dp))
                  SoundSlider("Surround / Space", "Virtual stereo widening", space, onSpace, "Narrow", "Wide")
                  Spacer(Modifier.height(12.dp))
                  Surface(color = Color(0xFFEAF3FC), shape = RoundedCornerShape(12.dp)) {
                      Row(Modifier.padding(12.dp), verticalAlignment = Alignment.Top) {
                          Icon(Icons.Default.Info, null, tint = Blue, modifier = Modifier.size(18.dp))
                          Text("Effects are applied through Android's audio-effect APIs when the device and output route allow it. They may not be available over every Bluetooth device.", color = Color(0xFF31536E), fontSize = 11.sp, lineHeight = 15.sp, modifier = Modifier.padding(start = 8.dp))
                      }
                  }
              }
          }

          @Composable
          private fun SoundSlider(title: String, subtitle: String, value: Float, onValue: (Float) -> Unit, low: String, high: String) {
              Surface(color = White, shape = RoundedCornerShape(13.dp)) {
                  Column(Modifier.padding(horizontal = 14.dp, vertical = 9.dp)) {
                      Row(verticalAlignment = Alignment.CenterVertically) { Column(Modifier.weight(1f)) { Text(title, color = Ink, fontWeight = FontWeight.SemiBold, fontSize = 14.sp); Text(subtitle, color = Muted, fontSize = 10.sp) }; Text("${(value * 100).toInt()}%", color = Blue, fontWeight = FontWeight.Bold, fontSize = 12.sp) }
                      Slider(value = value, onValueChange = onValue, valueRange = 0f..1f, colors = SliderDefaults.colors(thumbColor = Blue, activeTrackColor = Blue, inactiveTrackColor = Line), modifier = Modifier.height(27.dp))
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) { Text(low, color = Muted, fontSize = 9.sp); Text(high, color = Muted, fontSize = 9.sp) }
                  }
              }
          }

          @Composable
          private fun LyricsScreen(track: Track?) {
              Column(Modifier.fillMaxSize().padding(24.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Center) {
                  Icon(Icons.Default.Subject, null, tint = Blue, modifier = Modifier.size(48.dp))
                  Spacer(Modifier.height(12.dp)); Text(track?.title ?: "No track selected", color = Ink, fontWeight = FontWeight.Bold, fontSize = 18.sp, textAlign = TextAlign.Center)
                  Text(track?.artist ?: "", color = Muted, fontSize = 13.sp)
                  Spacer(Modifier.height(14.dp)); Text("Lyrics are not embedded in this first build. Local .lrc import and timed highlighting are planned for the next implementation pass.", color = Muted, fontSize = 12.sp, textAlign = TextAlign.Center, lineHeight = 17.sp)
              }
          }

          @Composable
          private fun AboutScreen() {
              Column(Modifier.fillMaxSize().padding(24.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Center) {
                  Box(Modifier.size(82.dp).clip(RoundedCornerShape(20.dp)).background(Blue), contentAlignment = Alignment.Center) { Icon(Icons.Default.MusicNote, null, tint = White, modifier = Modifier.size(47.dp)) }
                  Spacer(Modifier.height(15.dp)); Text("Pocket Player", color = Ink, fontSize = 24.sp, fontWeight = FontWeight.Bold)
                  Text("Version 2.0.0", color = Muted, fontSize = 12.sp)
                  Spacer(Modifier.height(12.dp)); Text("A nano-inspired offline player with Walkman-inspired sound controls.", color = Muted, fontSize = 13.sp, textAlign = TextAlign.Center)
              }
          }

          private fun formatTime(ms: Long): String { val seconds = (ms / 1000).coerceAtLeast(0); return "%d:%02d".format(seconds / 60, seconds % 60) }
          KOTLIN_MAIN

          cat > README.md <<'README'
          # Pocket Player 2.0
          Nano-inspired local Android music player with Media3 background playback and lock-screen media session, local library scanning, search, album/artist views, favorites/history, queue controls and Android Equalizer/BassBoost/Virtualizer controls where supported.
          Build output: `app/build/outputs/apk/debug/app-debug.apk`.
          Known limitations: lyrics import/timed display and ID3 tag/artwork editing are not implemented in this build; Android sound effects depend on the device and audio route. The interface is inspired by the iPod nano 7 layout, not an Apple product or exact proprietary asset copy.
          README

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-player-2-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
