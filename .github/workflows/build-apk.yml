          @Composable
          private fun NanoColors(selected: String, onSelect: (String) -> Unit) {
              val choices = listOf(
                  "Blue" to Color(0xFF168FE8), "Cyan" to Color(0xFF20C7D9),
                  "Violet" to Color(0xFFAB83FF), "Green" to Color(0xFF69C779),
                  "Amber" to Color(0xFFFFB547), "Rose" to Color(0xFFFF6F91)
              )
              Column(Modifier.fillMaxSize().background(Brush.verticalGradient(listOf(Color(0xFF303236), Color(0xFF17181B), Color(0xFF090A0C)))).padding(18.dp)) {
                  Text("Interface Colour", color = NanoInk, fontSize = 21.sp, fontWeight = FontWeight.Medium)
                  Spacer(Modifier.height(6.dp))
                  Text("Change the highlight colour across menus, sliders and active controls.", color = NanoGray, fontSize = 12.sp)
                  Spacer(Modifier.height(22.dp))
                  choices.chunked(3).forEach { row ->
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          row.forEach { (name, color) ->
                              Column(Modifier.weight(1f).clip(RoundedCornerShape(8.dp)).clickable { onSelect(name) }.padding(vertical = 10.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                                  Box(Modifier.size(52.dp).shadow(4.dp, RoundedCornerShape(13.dp)).clip(RoundedCornerShape(13.dp)).background(Brush.verticalGradient(listOf(Color.White.copy(alpha = 0.45f), color, color.copy(alpha = 0.70f)))).border(if (selected == name) 2.dp else 1.dp, if (selected == name) Color.White else Color.White.copy(alpha = 0.30f), RoundedCornerShape(13.dp)), contentAlignment = Alignment.Center) {
                                      if (selected == name) Icon(Icons.Default.Check, null, tint = Color.White, modifier = Modifier.size(25.dp))
                                  }
                                  Spacer(Modifier.height(7.dp))
                                  Text(name, color = if (selected == name) color else NanoInk, fontSize = 12.sp, fontWeight = if (selected == name) FontWeight.SemiBold else FontWeight.Normal)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun NanoSound(bass: Float, space: Float, preset: String, levels: List<Float>, onBass: (Float) -> Unit, onSpace: (Float) -> Unit, onPreset: (String) -> Unit, onLevel: (Int, Float) -> Unit) {
              Column(Modifier.fillMaxSize().background(Brush.verticalGradient(listOf(Color(0xFF303B49), Color(0xFF171D26), Color(0xFF0E1218)))).padding(horizontal = 18.dp)) {
                  Spacer(Modifier.height(12.dp))
                  Text("Equalizer", color = NanoInk, fontSize = 21.sp, fontWeight = FontWeight.Medium)
                  Spacer(Modifier.height(12.dp))
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                      listOf("Rich", "Bass", "Rock", "Vocal", "Treble", "Flat").forEach { name ->
                          Column(Modifier.weight(1f).shadow(if (preset == name) 6.dp else 2.dp, RoundedCornerShape(7.dp)).clip(RoundedCornerShape(7.dp)).background(Brush.verticalGradient(if (preset == name) listOf(Color(0xFF8CDBFF), Color(0xFF168FE8), Color(0xFF064B8D)) else listOf(Color(0xFF536174), Color(0xFF303A47), Color(0xFF171D26)))).border(1.dp, Color.White.copy(alpha = if (preset == name) 0.45f else 0.20f), RoundedCornerShape(7.dp)).clickable { onPreset(name) }.padding(vertical = 9.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                              Box(Modifier.fillMaxWidth().height(5.dp).background(Brush.verticalGradient(listOf(Color.White.copy(alpha = 0.20f), Color.Transparent))))
                              Text(name, color = Color.White, fontSize = 10.sp, maxLines = 1)
                          }
                      }
                  }
                  Spacer(Modifier.height(15.dp))
                  Row(Modifier.fillMaxWidth().height(190.dp), horizontalArrangement = Arrangement.spacedBy(8.dp), verticalAlignment = Alignment.CenterVertically) {
                      levels.forEachIndexed { index, level ->
                          Column(Modifier.weight(1f), horizontalAlignment = Alignment.CenterHorizontally) {
                              Text("${level.toInt()}", color = NanoGray, fontSize = 10.sp)
                              Slider(value = level, onValueChange = { onLevel(index, it) }, valueRange = -10f..10f, modifier = Modifier.height(142.dp).width(32.dp), colors = SliderDefaults.colors(thumbColor = NanoBlue, activeTrackColor = NanoBlue, inactiveTrackColor = NanoLine))
                              Text(listOf("60", "230", "910", "3.6k", "14k")[index], color = NanoGray, fontSize = 9.sp)
                          }
                      }
                  }
                  HorizontalDivider(color = NanoLine)
                  NanoSoundSlider("Clear Bass", bass, onBass, "Off", "Max")
                  HorizontalDivider(color = NanoLine)
                  NanoSoundSlider("Stereo Width", space, onSpace, "Narrow", "Wide")
                  Spacer(Modifier.height(10.dp))
                  Text("Sound effects depend on Android and the connected audio device.", color = NanoGray, fontSize = 11.sp)
              }
          }
          
          @Composable
          private fun NanoSoundSlider(title: String, value: Float, onValue: (Float) -> Unit, low: String, high: String) {
              Column(Modifier.fillMaxWidth().padding(vertical = 10.dp)) {
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) { Text(title, color = NanoInk, fontSize = 15.sp); Text("${(value * 100).toInt()}%", color = NanoGray, fontSize = 12.sp) }
                  Slider(value = value, onValueChange = onValue, valueRange = 0f..1f, colors = SliderDefaults.colors(thumbColor = NanoBlue, activeTrackColor = NanoBlue, inactiveTrackColor = NanoLine))
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) { Text(low, color = NanoGray, fontSize = 10.sp); Text(high, color = NanoGray, fontSize = 10.sp) }
              }
          }
          
          @Composable
          private fun NanoLyrics(track: Track?) {
              Column(Modifier.fillMaxSize().background(NanoWhite).padding(24.dp), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Center) {
                  Icon(Icons.Default.Subject, null, tint = NanoBlue, modifier = Modifier.size(40.dp))
                  Spacer(Modifier.height(12.dp)); Text(track?.title ?: "Not Playing", color = NanoInk, fontSize = 17.sp, fontWeight = FontWeight.SemiBold, textAlign = TextAlign.Center)
                  Text(track?.artist ?: "", color = NanoGray, fontSize = 12.sp)
                  Spacer(Modifier.height(12.dp)); Text("Lyrics and timed .lrc import are not included in this build yet.", color = NanoGray, fontSize = 12.sp, textAlign = TextAlign.Center)
              }
          }
          
          private fun formatTime(ms: Long): String {
              val seconds = (ms / 1000L).coerceAtLeast(0L)
              return "%d:%02d".format(seconds / 60L, seconds % 60L)
          }
          KOTLIN_MAIN

          cat > README.md <<'README'
          # Pocket Player — dark iPod nano 7 interface recreation
          Pocket Player is an independent dark recreation inspired by the 7th-generation iPod nano: glossy rounded-square home icons, compact dark music menus, centered track metadata, square album artwork, a single recessed transport strip with monochrome previous/play/next glyphs, and a narrow metallic seek rail. The transport controls have larger tap targets; the current album can be opened from the player, and a saved six-colour accent picker customizes active UI highlights. Shuffle, repeat, favorites, queue, lyrics placeholder, and sound controls remain accessible from a larger secondary toolbar. Includes local music scanning, search, album/artist views, favorites/history, queue, Media3 background playback and lock-screen media controls. Android Equalizer, BassBoost and Virtualizer are attached to the playback audio session where supported. The richer starting EQ profile, bounded bass boost and stereo widening require device-specific listening tests. This is an independent dark recreation, not a pixel-perfect Apple UI or an Apple product.
          Build output: `app/build/outputs/apk/debug/app-debug.apk`.
          Known limitations: lyrics import/timed display and ID3 tag/artwork editing are not implemented. Android sound effects depend on device and audio route. Exact pixel-for-pixel Apple UI reproduction is not guaranteed.
          README

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-player-nano-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
