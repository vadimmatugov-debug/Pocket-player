name: Build Basement Player APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Android project
        shell: bash
        run: |
          cat > settings.gradle.kts <<'GRADLE_SETTINGS'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BasementPlayer"
          include(":app")
          GRADLE_SETTINGS

          cat > build.gradle.kts <<'ROOT_GRADLE'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          ROOT_GRADLE

          cat > gradle.properties <<'GRADLE_PROPERTIES'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          GRADLE_PROPERTIES

          mkdir -p app/src/main/java/com/pocketplayer
          cat > app/build.gradle.kts <<'APP_GRADLE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.pocketplayer"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.pocketplayer"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1.0"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.media3:media3-exoplayer:1.5.1")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          APP_GRADLE

          cat > app/src/main/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <application android:label="Basement Player" android:theme="@android:style/Theme.Material.NoActionBar" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          cat > app/src/main/java/com/pocketplayer/MainActivity.kt <<'KOTLIN'
          package com.pocketplayer

          import android.Manifest
          import android.content.ContentUris
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.content.ContextCompat
          import androidx.media3.common.MediaItem
          import androidx.media3.exoplayer.ExoPlayer
          import kotlinx.coroutines.delay

          private val Black = Color(0xFF101010)
          private val Card = Color(0xFF202020)
          private val Lime = Color(0xFFD7F36B)
          private val Grey = Color(0xFFA5A59C)

          private data class Track(val id: Long, val title: String, val artist: String, val album: String, val uri: Uri)

          class MainActivity : ComponentActivity() {
              private lateinit var player: ExoPlayer
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  player = ExoPlayer.Builder(this).build()
                  val permission = if (Build.VERSION.SDK_INT >= 33) Manifest.permission.READ_MEDIA_AUDIO else Manifest.permission.READ_EXTERNAL_STORAGE
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme(primary = Lime, onPrimary = Black, background = Black, surface = Card, onSurface = Color.White, secondary = Lime)) {
                          BasementScreen(
                              player = player,
                              permission = permission,
                              granted = { ContextCompat.checkSelfPermission(this, permission) == PackageManager.PERMISSION_GRANTED },
                              loadTracks = { loadTracks() }
                          )
                      }
                  }
              }

              private fun loadTracks(): List<Track> {
                  val list = mutableListOf<Track>()
                  val collection = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                  val projection = arrayOf(MediaStore.Audio.Media._ID, MediaStore.Audio.Media.TITLE, MediaStore.Audio.Media.ARTIST, MediaStore.Audio.Media.ALBUM)
                  contentResolver.query(collection, projection, "${MediaStore.Audio.Media.IS_MUSIC} != 0", null, "${MediaStore.Audio.Media.TITLE} COLLATE NOCASE ASC")?.use { c ->
                      val idCol = c.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                      val titleCol = c.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
                      val artistCol = c.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST)
                      val albumCol = c.getColumnIndexOrThrow(MediaStore.Audio.Media.ALBUM)
                      while (c.moveToNext()) {
                          val id = c.getLong(idCol)
                          list += Track(id, c.getString(titleCol) ?: "Unknown track", c.getString(artistCol)?.takeUnless { it == "<unknown>" } ?: "Unknown artist", c.getString(albumCol)?.takeUnless { it == "<unknown>" } ?: "Unknown album", ContentUris.withAppendedId(collection, id))
                      }
                  }
                  return list
              }

              override fun onDestroy() { player.release(); super.onDestroy() }
          }

          @Composable
          private fun BasementScreen(player: ExoPlayer, permission: String, granted: () -> Boolean, loadTracks: () -> List<Track>) {
              var hasPermission by remember { mutableStateOf(granted()) }
              var tracks by remember { mutableStateOf(emptyList<Track>()) }
              var query by remember { mutableStateOf("") }
              var tab by remember { mutableStateOf("SONGS") }
              var current by remember { mutableStateOf<Track?>(null) }
              var playing by remember { mutableStateOf(false) }
              var position by remember { mutableLongStateOf(0L) }
              var duration by remember { mutableLongStateOf(1L) }
              val permissionLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { ok -> hasPermission = ok; if (ok) tracks = loadTracks() }

              LaunchedEffect(hasPermission) { if (hasPermission) tracks = loadTracks() }
              LaunchedEffect(player) {
                  while (true) { playing = player.isPlaying; position = player.currentPosition.coerceAtLeast(0); duration = player.duration.takeIf { it > 0 } ?: 1L; delay(350) }
              }
              val filtered = tracks.filter { (it.title + it.artist + it.album).contains(query, ignoreCase = true) }
              fun play(track: Track) {
                  current = track
                  player.setMediaItems(tracks.map { MediaItem.fromUri(it.uri) }, tracks.indexOf(track).coerceAtLeast(0), 0L)
                  player.prepare(); player.play(); playing = true
              }

              Column(Modifier.fillMaxSize().background(Black).padding(horizontal = 18.dp)) {
                  Spacer(Modifier.height(22.dp))
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Column(Modifier.weight(1f)) {
                          Text("POCKET MUSIC", color = Lime, fontSize = 11.sp, fontWeight = FontWeight.Bold, letterSpacing = 3.sp)
                          Text("PLAYER", color = Color.White, fontSize = 32.sp, fontWeight = FontWeight.Black, letterSpacing = (-1).sp)
                      }
                      IconButton(onClick = { if (hasPermission) tracks = loadTracks() else permissionLauncher.launch(permission) }) { Icon(Icons.Default.Refresh, contentDescription = "Rescan", tint = Lime) }
                  }
                  Spacer(Modifier.height(18.dp))
                  OutlinedTextField(value = query, onValueChange = { query = it }, modifier = Modifier.fillMaxWidth(), singleLine = true, placeholder = { Text("Search music", color = Grey) }, leadingIcon = { Icon(Icons.Default.Search, null, tint = Grey) }, shape = RoundedCornerShape(16.dp), colors = OutlinedTextFieldDefaults.colors(focusedBorderColor = Lime, unfocusedBorderColor = Card, focusedTextColor = Color.White, unfocusedTextColor = Color.White, cursorColor = Lime))
                  Spacer(Modifier.height(12.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      listOf("SONGS", "ALBUMS", "ARTISTS").forEach { label ->
                          val active = tab == label
                          Surface(color = if (active) Lime else Card, shape = RoundedCornerShape(30.dp), modifier = Modifier.clickable { tab = label }) {
                              Text(label, color = if (active) Black else Grey, modifier = Modifier.padding(horizontal = 14.dp, vertical = 9.dp), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                          }
                      }
                      Spacer(Modifier.weight(1f))
                      Text("${filtered.size}", color = Grey, modifier = Modifier.align(Alignment.CenterVertically), fontSize = 12.sp)
                  }
                  Spacer(Modifier.height(10.dp))
                  if (!hasPermission) {
                      Box(Modifier.weight(1f).fillMaxWidth(), contentAlignment = Alignment.Center) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Icon(Icons.Default.LibraryMusic, null, tint = Lime, modifier = Modifier.size(54.dp))
                              Spacer(Modifier.height(12.dp)); Text("Your music, your rules", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                              Text("Allow access to scan local audio files", color = Grey)
                              Spacer(Modifier.height(12.dp)); Button(onClick = { permissionLauncher.launch(permission) }) { Text("SCAN MUSIC") }
                          }
                      }
                  } else if (filtered.isEmpty()) {
                      Box(Modifier.weight(1f).fillMaxWidth(), contentAlignment = Alignment.Center) { Text("No music found\nAdd music files to your phone", color = Grey) }
                  } else {
                      val shown = when (tab) {
                          "ALBUMS" -> filtered.distinctBy { it.album }.sortedBy { it.album }
                          "ARTISTS" -> filtered.distinctBy { it.artist }.sortedBy { it.artist }
                          else -> filtered
                      }
                      LazyColumn(Modifier.weight(1f), contentPadding = PaddingValues(bottom = 10.dp), verticalArrangement = Arrangement.spacedBy(4.dp)) {
                          items(shown, key = { "${tab}_${it.id}" }) { track ->
                              Row(Modifier.fillMaxWidth().clip(RoundedCornerShape(13.dp)).background(if (current?.id == track.id) Card else Color.Transparent).clickable { if (tab == "ALBUMS") { val albumTracks = tracks.filter { it.album == track.album }; player.setMediaItems(albumTracks.map { MediaItem.fromUri(it.uri) }, 0, 0L); current = albumTracks.firstOrNull(); player.prepare(); player.play(); playing = true } else if (tab == "ARTISTS") { val artistTracks = tracks.filter { it.artist == track.artist }; player.setMediaItems(artistTracks.map { MediaItem.fromUri(it.uri) }, 0, 0L); current = artistTracks.firstOrNull(); player.prepare(); player.play(); playing = true } else play(track) }.padding(10.dp), verticalAlignment = Alignment.CenterVertically) {
                                  Box(Modifier.size(44.dp).clip(RoundedCornerShape(10.dp)).background(if (current?.id == track.id) Lime else Card), contentAlignment = Alignment.Center) { Icon(if (tab == "ALBUMS") Icons.Default.Album else if (tab == "ARTISTS") Icons.Default.Person else Icons.Default.MusicNote, null, tint = if (current?.id == track.id) Black else Grey) }
                                  Spacer(Modifier.width(12.dp))
                                  Column(Modifier.weight(1f)) {
                                      Text(if (tab == "ALBUMS") track.album else if (tab == "ARTISTS") track.artist else track.title, color = Color.White, fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                      Text(if (tab == "ALBUMS") "${tracks.count { it.album == track.album }} tracks · ${track.artist}" else if (tab == "ARTISTS") "${tracks.count { it.artist == track.artist }} tracks" else "${track.artist}  ·  ${track.album}", color = Grey, fontSize = 12.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  }
                                  if (current?.id == track.id && playing) Icon(Icons.Default.VolumeUp, null, tint = Lime)
                              }
                          }
                      }
                  }
                  Surface(color = Card, shape = RoundedCornerShape(topStart = 18.dp, topEnd = 18.dp), modifier = Modifier.fillMaxWidth()) {
                      Column(Modifier.padding(horizontal = 12.dp, vertical = 10.dp)) {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Box(Modifier.size(46.dp).clip(RoundedCornerShape(9.dp)).background(Lime), contentAlignment = Alignment.Center) { Icon(Icons.Default.Album, null, tint = Black, modifier = Modifier.size(29.dp)) }
                              Spacer(Modifier.width(10.dp))
                              Column(Modifier.weight(1f)) {
                                  Text(current?.title ?: "Nothing playing", color = Color.White, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  Text(current?.artist ?: "Choose a track", color = Grey, fontSize = 12.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                              }
                              IconButton(onClick = { if (player.hasPreviousMediaItem()) player.seekToPreviousMediaItem() }) { Icon(Icons.Default.SkipPrevious, null, tint = Color.White) }
                              IconButton(onClick = { if (player.isPlaying) player.pause() else if (player.mediaItemCount > 0) player.play(); playing = player.isPlaying }) { Icon(if (playing) Icons.Default.PauseCircleFilled else Icons.Default.PlayCircleFilled, null, tint = Lime, modifier = Modifier.size(36.dp)) }
                              IconButton(onClick = { if (player.hasNextMediaItem()) player.seekToNextMediaItem() }) { Icon(Icons.Default.SkipNext, null, tint = Color.White) }
                          }
                          Slider(value = (position.toFloat() / duration.toFloat()).coerceIn(0f, 1f), onValueChange = { position = (it * duration).toLong() }, onValueChangeFinished = { player.seekTo(position) }, colors = SliderDefaults.colors(thumbColor = Lime, activeTrackColor = Lime, inactiveTrackColor = Grey), modifier = Modifier.height(25.dp))
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) { Text(clock(position), color = Grey, fontSize = 10.sp); Text(clock(duration), color = Grey, fontSize = 10.sp) }
                      }
                  }
                  Spacer(Modifier.height(10.dp))
              }
          }

          private fun clock(ms: Long): String { val s = (ms / 1000).coerceAtLeast(0); return "%d:%02d".format(s / 60, s % 60) }
          KOTLIN

          cat > README.md <<'README'
          # Basement Player
          Native Android offline music-player prototype. Kotlin, Jetpack Compose and AndroidX Media3.
          First build: local song scan, search, Songs/Albums/Artists views, playback controls and seek bar.
          Later planned stages: background media session and lock-screen controls, queue reordering, lyrics, audio effects, ReplayGain, gapless playback, favourites/history/bookmarks, tag editing and artwork editing.
          README

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: basement-player-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
